name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Sources only (no binaries, nothing over 1 MiB)
        run: tools/check-tree
      - run: make check build
      # What answers cost on the fixed corpus, as the job's summary; the
      # test fails when an answer misses its section or its budget.
      - name: Cost evaluation
        run: EVAL_REPORT="$GITHUB_STEP_SUMMARY" make eval

  # The package as OBS builds it, on the distributions it is for. Leap 16
  # is built from the SLES 16 sources (same compiler, Go and rpm); SLES 16
  # itself is an OBS build target (packaging/suse/README.md).
  opensuse:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
          - distro: leap16
            image: registry.opensuse.org/opensuse/leap:16.0
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # rpmlint imports python's packaging module, which Leap 16's rpmlint
      # only recommends.
      - name: Install tools
        run: >
          zypper -n --gpg-auto-import-keys in --no-recommends
          git tar gzip xz rpm-build rpmlint curl 'python3dist(packaging)'
      - uses: actions/checkout@v4
      - name: Install build dependencies (from the spec, as OBS does)
        run: |
          rpmspec -q --buildrequires packaging/suse/mcp-docs.spec | tee /tmp/buildrequires
          xargs -d '\n' zypper -n --gpg-auto-import-keys in --no-recommends </tmp/buildrequires
      - name: Prepare sources (tarball and vendor.tar.gz, as the OBS services do)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(rpmspec -q --srpm --qf '%{version}' packaging/suse/mcp-docs.spec)
          echo "version=$version" >>"$GITHUB_ENV"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix="mcp-docs-$version/" -o ~/rpmbuild/SOURCES/mcp-docs-$version.tar.gz HEAD
          go mod vendor
          tar czf ~/rpmbuild/SOURCES/vendor.tar.gz vendor
          rm -rf vendor
      - name: rpmbuild
        # openSUSE's default topdir is /usr/src/packages.
        run: rpmbuild -ba --define "_topdir $HOME/rpmbuild" packaging/suse/mcp-docs.spec
      - name: rpmlint
        # On OBS the .changes file provides the changelog; here it is empty.
        run: |
          echo 'addFilter("no-changelogname-tag")' >/tmp/rpmlintrc
          rpmlint -r /tmp/rpmlintrc ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm
      - name: Install and smoke-test
        run: |
          rpm -ivh ~/rpmbuild/RPMS/*/mcp-docs-[0-9]*.rpm ~/rpmbuild/RPMS/*/mcp-docs-convert-[0-9]*.rpm
          packaging/suse/smoke-test.sh "$version"
      # A documentation package built with the converter just installed, as
      # OBS builds it (offline, from the source tarball its _service makes).
      - name: Documentation package (suse-docs-mcp-sles-16.0)
        run: |
          spec=packaging/suse-docs/sles-16.0/suse-docs-mcp-sles-16.0.spec
          cp "$(tools/suse-docs/source-tarball)" ~/rpmbuild/SOURCES/
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" "$spec"
          rpmlint -r /tmp/rpmlintrc ~/rpmbuild/RPMS/noarch/suse-docs-mcp-sles-16.0-*.rpm
          rpm -ivh ~/rpmbuild/RPMS/noarch/suse-docs-mcp-sles-16.0-*.rpm
          packaging/suse-docs/smoke-test.sh
      # Three versions, three source tarballs (6.2's is SLES 16.0's).
      - name: Documentation package (suse-docs-mcp-sle-micro)
        run: |
          spec=packaging/suse-docs/sle-micro/suse-docs-mcp-sle-micro.spec
          for v in 60:maintenance/SLE_Micro_6.0 61:maintenance/SLE_Micro_6.1 62:maintenance/SLE16.0; do
            rev=$(sed -n "s/^%define rev${v%%:*} *//p" "$spec")
            cp "$(tools/suse-docs/source-tarball "$rev" build "${v#*:}")" ~/rpmbuild/SOURCES/
          done
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" "$spec"
          rpmlint -r /tmp/rpmlintrc ~/rpmbuild/RPMS/noarch/suse-docs-mcp-sle-micro-*.rpm
          rpm -ivh ~/rpmbuild/RPMS/noarch/suse-docs-mcp-sle-micro-*.rpm
          packaging/suse-docs/smoke-test.sh suse-docs-mcp-sle-micro
          packaging/suse-docs/smoke-test.sh suse-docs-mcp-sles-16.0

  # The container image (packaging/container), built as a user builds it,
  # then run as a container runtime runs it: read-only, any user.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f packaging/container/Containerfile --build-arg VERSION=ci -t mcp-docs:ci .
      - name: Run and query
        run: |
          set -eu
          docker run -d --name mcp-docs --read-only -p 8080:8080 mcp-docs:ci
          for _ in $(seq 20); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 0.5; done
          curl -sS -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"find_sections","arguments":{"query":"stateless HTTP"}}}' \
            http://127.0.0.1:8080/mcp | tee /tmp/answer.json
          grep -q 'mcp-docs/architecture.md' /tmp/answer.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/mcp)" = 405
          docker logs mcp-docs 2>&1 | tee /tmp/logs
          grep -q 'listening on http://0.0.0.0:8080/mcp' /tmp/logs
          docker stop -t 30 mcp-docs
          test "$(docker inspect -f '{{.State.ExitCode}}' mcp-docs)" = 0
